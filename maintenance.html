<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g7store - Under Maintenance</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px
        }

        .brand {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1.8s infinite;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px
        }

        p {
            color: #666;
            margin-bottom: 25px
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo" style="width: 100%;">
            <img style="width: 200px;height: auto;" src="./logo/g7_logo.png" alt="">
        </div>
        <!-- <div class="brand">G7store</div> -->
        <div class="icon">🛠️</div>
        <h1>We're Under Maintenance</h1>
        <p>We are upgrading our store. Please check back soon.</p>
        <footer>© 2026 g7store. All rights reserved.</footer>
    </div>

</body>

</html>
